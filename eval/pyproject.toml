[project]
name = "rag-eval"
version = "0.1.0"
description = "RAG retrieval and coaching chatbot evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "mc-contracts",
    "microcoaching-platform",
    "rank-bm25>=0.2.2,<0.3.0",
]

[project.scripts]
rag-eval = "eval.rag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval"]
