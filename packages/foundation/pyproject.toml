[project]
name = "mc-foundation"
version = "0.1.0"
description = "MicroCoaching shared config, logging, and HTTP primitives"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.10.1,<3.0.0",
    "python-json-logger>=3.2.1,<4.0.0",
    "httpx>=0.28.1,<0.29.0",
    "starlette>=0.46.0,<0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_foundation"]
