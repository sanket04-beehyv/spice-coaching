[project]
name = "mc-contracts"
version = "0.1.0"
description = "MicroCoaching shared enums, API schemas, and internal service contracts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_contracts"]
