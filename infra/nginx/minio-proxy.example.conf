# Example nginx vhost for MinIO S3 API behind a VM reverse proxy.
# Use a dedicated hostname or port — not a path prefix under the platform API.
#
# Prerequisites (.env on the VM):
#   MINIO_PRESIGNED_ENDPOINT=storage.vm.example.com
#   MINIO_PRESIGNED_SECURE=true
#   MINIO_SECURE=false
#   MINIO_SERVER_URL=https://storage.vm.example.com
#
# See docs/SETUP_TROUBLESHOOTING.md § MinIO presigned URLs behind a reverse proxy.

upstream minio_s3 {
    server 127.0.0.1:19002;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name storage.vm.example.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    ignore_invalid_headers off;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_pass http://minio_s3;
    }
}
