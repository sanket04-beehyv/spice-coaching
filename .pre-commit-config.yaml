repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-error-codes-catalog
        name: check error codes catalog
        entry: uv run python scripts/check_error_codes_catalog.py
        language: system
        pass_filenames: false
        files: ^(docs/error-codes\.json|packages/contracts/src/mc_contracts/errors\.py)$
      - id: pyright
        name: pyright
        entry: uv
        language: system
        types: [python]
        pass_filenames: false
        args: [run, --frozen, pyright]
