[project]
name = "microcoaching-platform"
version = "0.1.0"
description = "MicroCoaching Platform — stateful API, workers, and analytics"
requires-python = ">=3.11"
dependencies = [
    "mc-contracts",
    "mc-foundation",
    "celery>=5.5.0,<6.0.0",
    "fastapi>=0.116.1,<0.117.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
    "sqlalchemy>=2.0.43,<3.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.16.4,<2.0.0",
    "pgvector>=0.4.1,<0.5.0",
    "redis>=6.4.0,<7.0.0",
    "clickhouse-connect>=0.8.0,<0.9.0",
    "aiofiles>=24.1.0,<25.0.0",
    "python-multipart>=0.0.20,<0.0.21",
    "pymupdf>=1.26.4,<2.0.0",
    "python-pptx>=1.0.2,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "python-json-logger>=3.2.1,<4.0.0",
    "minio>=7.2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_service"]
