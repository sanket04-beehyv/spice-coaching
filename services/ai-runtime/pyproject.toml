[project]
name = "ai-runtime"
version = "0.1.0"
description = "Stateless AI inference service — provider adapters, prompt execution, response parsing"
requires-python = ">=3.11"
dependencies = [
    "mc-contracts",
    "mc-foundation",
    "fastapi>=0.116.1,<0.117.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
    "httpx>=0.28.1,<0.29.0",
    "google-genai>=1.0.0,<2.0.0",
    "google-auth>=2.0.0,<3.0.0",
    "openai>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_runtime"]
